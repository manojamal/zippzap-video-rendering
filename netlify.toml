[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # Removed: Cross-Origin-Opener-Policy / Cross-Origin-Embedder-Policy / Content-Security-Policy.
    # They were added speculatively in the very first commit, self-admittedly never tested
    # against a live browser, and have sat on every response on the real deployment ever
    # since - while every render/download verification done in the dev sandbox went through
    # `vite preview`, which never reads this file at all. That's a real blind spot: this is
    # the one thing that could break the render pipeline specifically on the deployed site
    # while looking completely fine in every local test. COEP: credentialless in particular is
    # a known way to silently break worker/WASM loading in some browsers - and this app's
    # entire render pipeline runs through ffmpeg's own Worker + WASM. The multi-threaded
    # ffmpeg core these headers exist to unlock is already an optional, gracefully-degrading
    # perf boost (see getFFmpeg() in ffmpegService.ts) - not something worth this risk without
    # being able to verify it live. If cross-origin isolation is wanted back later, add it
    # behind an explicit test against the real deployed site, not speculatively.
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self), geolocation=()"

[[headers]]
  for = "/ffmpeg/ffmpeg-core.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ffmpeg/ffmpeg-core.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ffmpeg-mt/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"
